spring.application.name=ferreteria
server.port=8080
# Escuchar en todas las interfaces para que el celular (misma red Wi-Fi) pueda conectarse
server.address=0.0.0.0

spring.datasource.url=jdbc:mysql://localhost:3306/db_ferreteria?createDatabaseIfNotExist=true&serverTimezone=America/Guatemala&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=${DB_USER:root}
# La contraseña NO va en el repositorio: se lee de la variable de entorno DB_PASSWORD
# o de un archivo application-local.properties (ignorado por git), que puede estar
# junto al pom.xml o en src/main/resources. Ver application-local.properties.example.
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
